name: coleta e publicacao
# titulo de cada execucao na aba Actions (sem isso o GitHub usa a mensagem do commit)
run-name: ${{ github.event_name == 'push' && 'Publicação do site' || github.event_name == 'schedule' && 'Coleta diária' || 'Coleta manual' }}
on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 em Brasilia
  workflow_dispatch:     # botao "Run workflow" na aba Actions
  push:
    branches: [main]
permissions: {}  # cada job pede so o que usa
concurrency:
  group: publicacao
  cancel-in-progress: false
jobs:
  coleta:
    if: github.event_name != 'push'  # push so republica o site, sem coletar de novo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # commit dos dados coletados
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r coleta/requirements.txt
      - run: python coleta/coletar.py
      - run: |
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add site/dados.json site/mudancas.json site/status.json site/fotos coleta/geo_cache.json coleta/arredores_cache.json
          # pull antes do push: um commit na main durante a coleta (que leva ate 1 h) rejeitaria o push e perderia o dia
          git diff --cached --quiet || (git commit -m "Atualiza dados coletados" && git pull --rebase && git push)

  publicar:
    # o commit da coleta nao dispara outro workflow, entao a publicacao roda aqui mesmo
    needs: coleta
    if: always() && needs.coleta.result != 'failure' && needs.coleta.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main  # pega o commit novo da coleta
      - run: python3 coleta/paginas.py  # paginas por empreendimento e sitemap; geradas aqui, fora do git
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
