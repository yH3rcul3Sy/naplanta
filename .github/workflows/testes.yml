name: testes
# roda em todo push e pull request (inclusive branches de teste) e nao publica nada.
# A coleta chama este workflow antes de coletar; o job "publicar" roda a mesma bateria (coleta/testes/tudo.sh)
# sobre o commit exato que publica.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: commit ou branch a testar (vazio = o do evento)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r coleta/requirements.txt ruff==0.17.0
      - run: bash coleta/testes/tudo.sh
