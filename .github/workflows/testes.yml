name: testes
# roda em todo push e pull request (inclusive branches de teste) e nao publica nada;
# o deploy da main chama este mesmo workflow e so publica se ele passar
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r coleta/requirements.txt ruff==0.17.0
      - name: Lint (erros reais e caracteres invisiveis no codigo)
        # E9 sintaxe, F nomes indefinidos e imports quebrados, PLE25 caracteres de controle (o bug do \b virando backspace)
        run: ruff check coleta --select E9,F,PLE25 --output-format github
      - name: Autotestes das regras (assert dentro dos modulos)
        working-directory: coleta
        run: python -c "import coletar, paginas, alerta, alertas, naplanta.publicacao.paginas, naplanta.app.alertas; print('autotestes ok')"
      - name: Leitura dos coletores contra paginas gravadas
        run: python coleta/testes/testar.py
      - name: Validacao dos dados publicados
        run: python coleta/testes/validar_dados.py
      - name: Sintaxe do JavaScript do site
        run: |
          for f in $(git ls-files 'site/js/*.js' 'site/js/**/*.js' | grep -v vendor); do
            cp "$f" /tmp/x.mjs && node --check /tmp/x.mjs || { echo "::error file=$f::erro de sintaxe"; exit 1; }
          done
