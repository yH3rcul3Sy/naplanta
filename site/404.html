<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#1f6f4a; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         color:var(--ink); background:var(--bg); padding:16px; box-sizing:border-box; }
  main { max-width:460px; text-align:center; }
  .marca { font-size:28px; font-weight:700; color:inherit; text-decoration:none; } .marca span { color:var(--accent); }
  .pino { width:56px; height:56px; margin:28px auto 8px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--line); border:4px solid #fff;
          box-shadow:0 2px 8px rgba(0,0,0,.15); }
  h1 { font-size:26px; margin:18px 0 6px; } p { color:var(--muted); margin:0 0 20px; }
  .botoes { display:grid; gap:8px; }
  .btn { display:flex; align-items:center; justify-content:center; min-height:48px; border-radius:12px; font-weight:600; text-decoration:none;
         border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primario { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.primario:hover { background:#185a3c; color:#fff; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
