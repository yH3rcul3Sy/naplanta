<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- so carrega o que vem do proprio site, da CDN do Leaflet e dos mapas do OSM; o JS mora em app.js, entao script inline e bloqueado
     (style inline segue liberado: os pinos e o Leaflet usam style="...") -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7f2ec">
<title>NaPlanta · lançamentos imobiliários na planta</title>
<meta name="description" content="Mapa gratuito de lançamentos imobiliários na planta em Mogi das Cruzes, Alto Tietê e Grande São Paulo, com dados direto das incorporadoras e atualizado todo dia.">
<meta property="og:title" content="NaPlanta">
<meta property="og:description" content="Mapa gratuito de lançamentos imobiliários na planta, atualizado todo dia direto dos sites das incorporadoras.">
<meta property="og:image" content="https://yh3rcul3sy.github.io/naplanta/icone-512.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yh3rcul3sy.github.io/naplanta/">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<meta name="keywords" content="lançamentos imobiliários, imóveis na planta, apartamento na planta, Mogi das Cruzes, Alto Tietê, Suzano, Grande São Paulo, breve lançamento, imóvel novo, Minha Casa Minha Vida, mapa de lançamentos">
<link rel="canonical" href="https://yh3rcul3sy.github.io/naplanta/">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="dados.json" as="fetch" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#1f6f4a;
          --breve:#8a5a00; --breve-bg:#fbefd6; --lanc:#9a3b12; --lanc-bg:#fbe3d8;
          --obras:#1d4f91; --obras-bg:#dde8f7; --pronto:#1f6f4a; --pronto-bg:#e0f0e7;
          --accent-bg:#e7f2ec; --linha-forte:#c9c6bf; --sombra:0 6px 18px rgba(29,29,27,.12); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-rows:auto 1fr; height:100dvh; overflow:hidden; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; }
  h1 { margin:0 8px 0 0; font-size:25px; letter-spacing:-.3px; } h1 span { color:var(--accent); }
  #filtros { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
  select, input { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); min-width:110px;
                  cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  input[type=number] { cursor:text; }
  select:hover, input:hover { border-color:var(--linha-forte); }
  select:focus-visible, input:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  button:focus-visible, a:focus-visible, .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
           padding:7px 14px; transition:background-color .15s, border-color .15s, color .15s, transform .1s; }
  button:hover { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
  button:active { transform:translateY(1px); }
  .botao { display:inline-flex; align-items:center; font-weight:600; font-size:inherit; color:var(--ink); text-decoration:none; border:1px solid var(--line);
           background:#fff; border-radius:10px; padding:7px 14px; transition:background-color .15s, border-color .15s, color .15s; }
  .botao:hover { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
  .check { flex-direction:row; align-items:center; gap:8px; font-size:14px; color:var(--ink); cursor:pointer; padding:7px 0; }
  .check input { min-width:0; width:18px; height:18px; margin:0; accent-color:var(--accent); cursor:pointer; }
  #rodape { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; white-space:nowrap; }
  /* computador: tudo numa linha so; os campos encolhem na proporcao de --w (o select corta o texto se faltar espaco) */
  @media (min-width: 801px) {
    header { flex-wrap:nowrap; gap:8px; padding:8px 12px; }
    h1 { font-size:22px; margin-right:4px; }
    header select, header input, header button, header .botao { font-size:14px; }
    header button, header .botao { padding:6px 11px; white-space:nowrap; }
    select, input { padding:6px 6px; }
    #filtros { flex:1 1 auto; flex-wrap:nowrap; min-width:0; gap:8px; justify-content:center; }  /* centralizado entre a marca e o total */
    #filtros > label:not(.check) { flex:1 1 var(--w, 110px); min-width:0; max-width:calc(var(--w, 110px) * 1.5); }
    #filtros > label.fixo { flex:0 0 var(--w); max-width:var(--w); }
    #filtros select, #filtros input:not([type=checkbox]) { width:100%; min-width:0; }
    .check { white-space:nowrap; font-size:14px; }
  }
  /* notebook (801 a 1279 px): os filtros nao cabem na linha da marca, entao descem para uma segunda linha */
  @media (min-width: 801px) and (max-width: 1279px) {
    header { flex-wrap:wrap; }
    #filtros { order:3; flex-basis:100%; justify-content:flex-start; }
    #rodape { margin-left:auto; }
  }
  #abrirFiltros, #alternar { display:none; }
  .acoes { display:flex; flex-wrap:wrap; gap:4px 16px; }
  main { display:grid; grid-template-columns:390px 1fr; min-height:0; }
  #lista { overflow:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .card { flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer;
          transition:border-color .15s, box-shadow .2s, transform .2s; }
  .card:hover { border-color:var(--accent); box-shadow:var(--sombra); transform:translateY(-2px); }
  .card.ativo { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), var(--sombra); }
  .card img { width:100%; height:auto; aspect-ratio:16/8; object-fit:cover; display:block; background:var(--line); transition:transform .4s; }
  .card:hover img { transform:scale(1.03); }
  .card .corpo { padding:10px 14px 12px; }
  .card h2 { margin:0 0 4px; font-size:20px; line-height:1.2; }
  .etapa { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; margin-bottom:6px; }
  .e-breve { color:var(--breve); background:var(--breve-bg); } .e-lanc { color:var(--lanc); background:var(--lanc-bg); }
  .e-obras { color:var(--obras); background:var(--obras-bg); } .e-pronto { color:var(--pronto); background:var(--pronto-bg); }
  .info { color:var(--muted); font-size:13px; margin:2px 0; }
  .fatos { color:var(--ink); font-weight:600; margin:6px 0; }
  a { color:var(--accent); }
  .fonte { display:inline-block; padding:6px 0; font-weight:600; text-underline-offset:3px; }
  .fonte:hover { color:var(--ink); }
  .aprox { color:var(--breve); }
  .vazio { text-align:center; color:var(--muted); padding:40px 16px; }
  #mapa { min-height:0; }
  .grupo { display:grid; place-items:center; background:var(--ink); color:#fff; border:2px solid #fff; border-radius:50%;
           font-size:12px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.4); transition:transform .15s; }
  .grupo:hover { transform:scale(1.12); }
  .pino { width:18px; height:18px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
          transition:transform .15s; transform-origin:0 100%; }
  .leaflet-marker-icon:hover .pino { transform:rotate(-45deg) scale(1.25); }
  .leaflet-popup-content { margin:12px 14px; font:inherit; }
  .leaflet-popup-content h2 { font-size:16px; font-weight:700; margin:0 0 4px; }
  .legenda { background:#fff; padding:6px 10px; border-radius:8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); line-height:1.7; }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #abrirNovidades b, #abrirFiltros b { background:var(--accent); color:#fff; border-radius:99px; padding:0 7px; font-size:12px; margin-left:6px; }
  .selo-novo { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; margin:0 0 6px 6px; background:var(--ink); color:#fff; }
  #novidades { width:min(560px, calc(100% - 24px)); max-height:min(80dvh, 720px); border:0; border-radius:14px; padding:0; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  #novidades::backdrop { background:rgba(0,0,0,.4); }
  #novidades header { position:sticky; top:0; padding:16px 18px 12px; flex-wrap:nowrap; }
  #novidades h2 { margin:0; font-size:20px; }
  #novidades header p { margin:2px 0 0; }
  #fecharNovidades { margin-left:auto; align-self:flex-start; }
  #eventos { padding:6px 18px 18px; }
  #eventos h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 6px; }
  .evento { display:block; width:100%; text-align:left; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;
            background:#fff; color:var(--ink); font-weight:400; }
  .evento[disabled] { cursor:default; }
  .evento[disabled]:hover { background:#fff; border-color:var(--line); color:var(--ink); }
  .evento:not([disabled]):hover { color:var(--ink); }
  .evento strong { display:block; }
  .t-novo { color:var(--pronto); } .t-etapa { color:var(--obras); } .t-saiu { color:var(--lanc); }
  .tipo-evento { font-size:12px; font-weight:700; }
  @media (max-width: 1100px) and (min-width: 801px) { main { grid-template-columns:330px 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }
  @media (hover: none) { .card:hover { transform:none; box-shadow:none; } .card:hover img { transform:none; } }

  @media (max-width: 800px) {
    header { padding:10px 12px; gap:8px; }
    h1 { margin-right:0; }
    #abrirNovidades { margin-left:auto; }
    #abrirNovidades, #abrirFiltros { padding:7px 10px; min-height:44px; }
    #abrirFiltros { display:inline-flex; gap:6px; align-items:center; }
    #abrirFiltros b { background:var(--accent); color:#fff; border-radius:99px; padding:0 7px; font-size:12px; }
    #rodape { margin-left:0; width:100%; justify-content:space-between; }
    #rodape { font-size:14px; }
    #rodape .botao { min-height:44px; font-size:16px; }
    #filtros { order:0; display:none; width:100%; grid-template-columns:1fr 1fr; gap:10px; }
    body.filtros-abertos #filtros { display:grid; }
    select, input { min-width:0; width:100%; min-height:44px; font-size:16px; }  /* menos que 16px o iPhone da zoom ao tocar */
    #limpar { grid-column:1 / -1; min-height:44px; }
    main { grid-template-columns:1fr; position:relative; }
    #lista, #mapa { grid-area:1 / 1; }
    #lista { padding:12px 12px 90px; background:var(--bg); z-index:1001; }
    body:not(.ver-lista) #lista { visibility:hidden; }
    #alternar { display:flex; position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:1100;
                background:var(--ink); color:#fff; border:0; border-radius:99px; padding:12px 22px; min-height:48px; font-weight:600;
                box-shadow:0 4px 14px rgba(0,0,0,.3); gap:8px; align-items:center; }
    #alternar:hover, #alternar:active { background:var(--accent); color:#fff; }
    .check { align-self:end; min-height:44px; font-size:14px; line-height:1.2; }
  }
</style>
</head>
<body>
<header>
  <h1>Na<span>Planta</span></h1>
  <button id="abrirNovidades" type="button" aria-haspopup="dialog">Novidades<b id="nNovidades" hidden></b></button>
  <button id="abrirFiltros" aria-expanded="false" aria-controls="filtros">Filtros <b id="nFiltros" hidden></b></button>
  <div id="filtros">
    <label style="--w:150px">Cidade <select id="cidade"><option value="">Todas</option></select></label>
    <label style="--w:130px">Tipo <select id="tipo"><option value="">Todos</option></select></label>
    <label style="--w:125px">Etapa <select id="etapa"><option value="">Todas</option></select></label>
    <label style="--w:125px">Construtora <select id="construtora"><option value="">Todas</option></select></label>
    <label class="fixo" style="--w:74px">Dorms <select id="dorms"><option value="">Todos</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label>
    <label class="fixo" style="--w:88px">Estação <select id="estacao" title="Distância até a estação de trem ou metrô"><option value="">Todas</option><option value="1">até 1 km</option><option value="2">até 2 km</option><option value="3">até 3 km</option></select></label>
    <label class="fixo" style="--w:70px">Área mín. <input id="m2" type="number" inputmode="numeric" min="0" step="10" placeholder="m²"></label>
    <label class="check" title="Incluir empreendimentos prontos para morar"><input id="prontos" type="checkbox"> Prontos</label>
    <button id="limpar" type="button">Limpar</button>
  </div>
  <div id="rodape"><span id="total" aria-live="polite"></span><a class="botao" href="transparencia.html">Sobre os dados</a></div>
</header>
<main>
  <section id="lista" aria-label="Empreendimentos"></section>
  <div id="mapa" role="region" aria-label="Mapa dos empreendimentos"></div>
</main>
<button id="alternar" type="button">Ver lista</button>
<dialog id="novidades" aria-labelledby="tituloNovidades">
  <header>
    <div>
      <h2 id="tituloNovidades">O que mudou</h2>
      <p class="info" id="resumoNovidades"></p>
    </div>
    <button id="fecharNovidades" type="button" aria-label="Fechar">✕</button>
  </header>
  <div id="eventos"></div>
</dialog>
<!-- integrity: o navegador recusa o arquivo se a CDN entregar algo diferente; ao trocar de versao, gerar o hash de novo -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
