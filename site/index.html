<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>NaPlanta</title>
<link rel="icon" type="image/png" href="favicon-claro.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="favicon.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="dados.json" as="fetch" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#1f6f4a;
          --breve:#8a5a00; --breve-bg:#fbefd6; --lanc:#9a3b12; --lanc-bg:#fbe3d8;
          --obras:#1d4f91; --obras-bg:#dde8f7; --pronto:#1f6f4a; --pronto-bg:#e0f0e7; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-rows:auto 1fr; height:100dvh; overflow:hidden; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; }
  h1 { margin:0 8px 0 0; font-size:25px; letter-spacing:-.3px; } h1 span { color:var(--accent); }
  #filtros { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
  select, input { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-width:130px; }
  select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 12px; }
  #limpar { border:0; background:none; color:var(--accent); text-decoration:underline; padding:7px 4px; }
  #rodape { margin-left:auto; color:var(--muted); font-size:12px; }
  #abrirFiltros, #alternar { display:none; }
  main { display:grid; grid-template-columns:390px 1fr; min-height:0; }
  #lista { overflow:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .card { flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:border-color .15s; }
  .card:hover, .card.ativo { border-color:var(--accent); }
  .card.ativo { box-shadow:0 0 0 2px var(--accent); }
  .card img { width:100%; height:auto; aspect-ratio:16/8; object-fit:cover; display:block; background:var(--line); }
  .card .corpo { padding:10px 14px 12px; }
  .card h2 { margin:0 0 4px; font-size:20px; line-height:1.2; }
  .etapa { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; margin-bottom:6px; }
  .e-breve { color:var(--breve); background:var(--breve-bg); } .e-lanc { color:var(--lanc); background:var(--lanc-bg); }
  .e-obras { color:var(--obras); background:var(--obras-bg); } .e-pronto { color:var(--pronto); background:var(--pronto-bg); }
  .info { color:var(--muted); font-size:12px; margin:2px 0; }
  .fatos { color:var(--ink); font-weight:600; margin:6px 0; }
  a { color:var(--accent); }
  .fonte { display:inline-block; padding:6px 0; }
  .vazio { text-align:center; color:var(--muted); padding:40px 16px; }
  #mapa { min-height:0; }
  .grupo { display:grid; place-items:center; background:var(--ink); color:#fff; border:2px solid #fff; border-radius:50%;
           font-size:12px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pino { width:18px; height:18px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .leaflet-popup-content { margin:12px 14px; font:inherit; }
  .leaflet-popup-content h2 { font-size:16px; font-weight:700; margin:0 0 4px; }
  .legenda { background:#fff; padding:6px 10px; border-radius:8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); line-height:1.7; }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #abrirNovidades b, #abrirFiltros b { background:var(--accent); color:#fff; border-radius:99px; padding:0 7px; font-size:12px; margin-left:6px; }
  .selo-novo { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; margin:0 0 6px 6px; background:var(--ink); color:#fff; }
  #novidades { width:min(560px, calc(100% - 24px)); max-height:min(80dvh, 720px); border:0; border-radius:14px; padding:0; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  #novidades::backdrop { background:rgba(0,0,0,.4); }
  #novidades header { position:sticky; top:0; padding:16px 18px 12px; flex-wrap:nowrap; }
  #novidades h2 { margin:0; font-size:20px; }
  #novidades header p { margin:2px 0 0; }
  #fecharNovidades { margin-left:auto; align-self:flex-start; }
  #eventos { padding:6px 18px 18px; }
  #eventos h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 6px; }
  .evento { display:block; width:100%; text-align:left; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fff; }
  .evento[disabled] { cursor:default; }
  .evento:not([disabled]):hover { border-color:var(--accent); }
  .evento strong { display:block; }
  .t-novo { color:var(--pronto); } .t-etapa { color:var(--obras); } .t-saiu { color:var(--lanc); }
  .tipo-evento { font-size:12px; font-weight:700; }

  @media (max-width: 800px) {
    header { padding:10px 12px; gap:8px; }
    h1 { margin-right:0; }
    #abrirNovidades { margin-left:auto; }
    #abrirNovidades, #abrirFiltros { padding:7px 10px; min-height:44px; }
    #abrirFiltros { display:inline-flex; gap:6px; align-items:center; }
    #abrirFiltros b { background:var(--accent); color:#fff; border-radius:99px; padding:0 7px; font-size:12px; }
    #rodape { margin-left:0; width:100%; }
    #filtros { display:none; width:100%; grid-template-columns:1fr 1fr; gap:10px; }
    body.filtros-abertos #filtros { display:grid; }
    select, input { min-width:0; width:100%; min-height:44px; }  /* herdam 16px: menos que isso o iPhone da zoom ao tocar */
    #limpar { grid-column:1 / -1; min-height:44px; }
    main { grid-template-columns:1fr; position:relative; }
    #lista, #mapa { grid-area:1 / 1; }
    #lista { padding:12px 12px 90px; background:var(--bg); z-index:1001; }
    body:not(.ver-lista) #lista { visibility:hidden; }
    #alternar { display:flex; position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:1100;
                background:var(--ink); color:#fff; border:0; border-radius:99px; padding:12px 22px; min-height:48px; font-weight:600;
                box-shadow:0 4px 14px rgba(0,0,0,.3); gap:8px; align-items:center; }
  }
</style>
</head>
<body>
<header>
  <h1>Na<span>Planta</span></h1>
  <button id="abrirNovidades" type="button" aria-haspopup="dialog">Novidades<b id="nNovidades" hidden></b></button>
  <button id="abrirFiltros" aria-expanded="false" aria-controls="filtros">Filtros <b id="nFiltros" hidden></b></button>
  <div id="filtros">
    <label>Cidade <select id="cidade"><option value="">Todas</option></select></label>
    <label>Tipo <select id="tipo"><option value="">Todos</option></select></label>
    <label>Etapa <select id="etapa"><option value="">Todas</option></select></label>
    <label>Construtora <select id="construtora"><option value="">Todas</option></select></label>
    <label>Dormitórios (mín.) <select id="dorms"><option value="">Qualquer</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <label>Estação de trem/metrô <select id="estacao"><option value="">Qualquer distância</option><option value="1">Até 1 km</option><option value="2">Até 2 km</option><option value="3">Até 3 km</option></select></label>
    <label>Área mín. (m²) <input id="m2" type="number" inputmode="numeric" min="0" step="10" placeholder="ex.: 60"></label>
    <button id="limpar" type="button">Limpar filtros</button>
  </div>
  <span id="rodape"><span id="total" aria-live="polite"></span> · <a href="transparencia.html">Sobre os dados</a></span>
</header>
<main>
  <section id="lista" aria-label="Empreendimentos"></section>
  <div id="mapa" role="region" aria-label="Mapa dos empreendimentos"></div>
</main>
<button id="alternar" type="button">Ver lista</button>
<dialog id="novidades" aria-labelledby="tituloNovidades">
  <header>
    <div>
      <h2 id="tituloNovidades">O que mudou</h2>
      <p class="info" id="resumoNovidades"></p>
    </div>
    <button id="fecharNovidades" type="button" aria-label="Fechar">✕</button>
  </header>
  <div id="eventos"></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const $ = id => document.getElementById(id);
const CAMPOS = ['cidade', 'tipo', 'etapa', 'construtora', 'dorms', 'estacao', 'm2'];
const ETAPA = { 'Breve lançamento': ['e-breve', '#c58a1a'], 'Lançamento': ['e-lanc', '#d0582a'],
                'Em obras': ['e-obras', '#2f6fc4'], 'Pronto para morar': ['e-pronto', '#1f8a58'] };
const celular = matchMedia('(max-width: 800px)');
const mapa = L.map('mapa', { tap: false }).setView([-23.52, -46.19], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(mapa);
// pinos proximos viram um circulo com o total; de perto so agrupa os que ficariam um em cima do outro,
// e esse grupo abre em leque no clique (predios vizinhos com a mesma coordenada, como Mirage e Solare)
const camada = L.markerClusterGroup({ maxClusterRadius: z => z < 15 ? 45 : 12, showCoverageOnHover: false, animate: false,
  iconCreateFunction: g => L.divIcon({ className: 'grupo', html: g.getChildCount(), iconSize: [34, 34] }) }).addTo(mapa);
const legenda = L.control({ position: 'bottomleft' });
legenda.onAdd = () => Object.assign(L.DomUtil.create('div', 'legenda'), {
  innerHTML: Object.entries(ETAPA).map(([n, [, c]]) => `<i style="background:${c}"></i>${n}`).join('<br>') });
legenda.addTo(mapa);
const faixa = (v, u = '') => v ? (v[0] === v[1] ? v[0] : `${v[0]} a ${v[1]}`) + u : null;
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
// dados do OpenStreetMap: estacao a ate 3 km e servicos a ate 1 km, distancias em linha reta
function arredores(e) {
  if (e.estacao === undefined) return '';  // ainda nao consultado
  const est = e.estacao
    ? `Estação ${esc(e.estacao.nome)} (${e.estacao.tipo}) · ${e.estacao.km.toLocaleString('pt-BR')} km em linha reta`
    : 'Nenhuma estação de trem ou metrô a até 3 km';
  const p = e.perto || {};
  const servicos = [p.escolas && plural(p.escolas, 'escola', 'escolas'), p.saude && plural(p.saude, 'serviço de saúde', 'serviços de saúde'),
                    p.mercados && plural(p.mercados, 'mercado', 'mercados'), p.parques && plural(p.parques, 'parque', 'parques')].filter(Boolean);
  return `<p class="info perto">${est}</p>` + (servicos.length ? `<p class="info perto">A até 1 km: ${servicos.join(' · ')}</p>` : '');
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pino = e => L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 18], popupAnchor: [0, -18],
  html: `<div class="pino" style="background:${(ETAPA[e.etapa] || [, '#666'])[1]}"></div>` });
let dados = [];

function verLista(sim) {
  document.body.classList.toggle('ver-lista', sim);
  $('alternar').textContent = sim ? 'Ver mapa' : 'Ver lista';
  if (!sim) mapa.invalidateSize();
}
$('alternar').onclick = () => verLista(!document.body.classList.contains('ver-lista'));
$('abrirFiltros').onclick = () => {
  const aberto = document.body.classList.toggle('filtros-abertos');
  $('abrirFiltros').setAttribute('aria-expanded', aberto);
  mapa.invalidateSize();
};
$('limpar').onclick = () => { CAMPOS.forEach(id => $(id).value = ''); render(); };
CAMPOS.forEach(id => $(id).addEventListener('input', render));

const DIAS_NOVO = 7, DIAS_PAINEL = 30;
const diasAtras = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
const dataBR = iso => iso.split('-').reverse().join('/');
const TIPO_EVENTO = { novo: ['t-novo', 'Novo no site'], etapa: ['t-etapa', 'Mudou de etapa'], saiu: ['t-saiu', 'Saiu do site'] };
let mudancas = { inicio: null, eventos: [] };
const abrirPor = new Map();  // fonte -> funcao que foca o empreendimento no mapa

function eventosVisiveis(dias) {
  const cidade = $('cidade').value, limite = diasAtras(dias);
  return mudancas.eventos.filter(e => e.data >= limite && (!cidade || e.cidade === cidade));
}

function mostrarNovidades() {
  const cidade = $('cidade').value, evs = eventosVisiveis(DIAS_PAINEL);
  $('resumoNovidades').textContent = `Últimos ${DIAS_PAINEL} dias ${cidade ? 'em ' + cidade : 'em todas as cidades'}` +
    (mudancas.inicio ? ` · acompanhando diariamente desde ${dataBR(mudancas.inicio)}` : '');
  $('eventos').innerHTML = evs.length ? '' :
    '<p class="vazio">Nenhuma mudança nesse período.<br>A coleta roda todo dia: lançamentos, trocas de etapa e saídas aparecem aqui.</p>';
  let dia;
  for (const e of evs) {
    if (e.data !== dia) $('eventos').insertAdjacentHTML('beforeend', `<h3>${dataBR(dia = e.data)}</h3>`);
    const [cls, rotulo] = TIPO_EVENTO[e.tipo];
    const detalhe = e.tipo === 'etapa' ? `${esc(e.de)} → ${esc(e.etapa)}`
      : e.tipo === 'saiu' ? 'Provavelmente esgotado ou retirado pela incorporadora' : esc(e.etapa);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'evento';
    b.disabled = e.tipo === 'saiu' || !dados.some(d => d.fonte === e.fonte && d.lat != null);
    b.innerHTML = `<span class="tipo-evento ${cls}">${rotulo}</span><strong>${esc(e.nome)}</strong>
      <span class="info">${esc(e.construtora)} · ${esc(e.cidade ?? '')} · ${detalhe}</span>`;
    b.onclick = () => {
      $('novidades').close();
      if (!abrirPor.has(e.fonte)) { CAMPOS.forEach(id => $(id).value = ''); $('cidade').value = e.cidade ?? ''; render(); }
      abrirPor.get(e.fonte)?.({ target: document.body }, !celular.matches);
    };
    $('eventos').append(b);
  }
  $('novidades').showModal();
}
$('abrirNovidades').onclick = mostrarNovidades;
$('fecharNovidades').onclick = () => $('novidades').close();
$('novidades').onclick = ev => { if (ev.target === $('novidades')) $('novidades').close(); };  // clique fora fecha

Promise.all([
  fetch('dados.json').then(r => r.json()),
  fetch('mudancas.json').then(r => r.ok ? r.json() : mudancas).catch(() => mudancas),
]).then(([d, m]) => {
  dados = d; mudancas = m;
  for (const k of ['cidade', 'tipo', 'etapa', 'construtora'])
    [...new Set(d.map(e => e[k]).filter(Boolean))].sort().forEach(v => $(k).add(new Option(v, v)));
  if ([...$('cidade').options].some(o => o.value === 'Mogi das Cruzes')) $('cidade').value = 'Mogi das Cruzes';
  render();
});

function marcar(card, rolar) {
  document.querySelectorAll('.card.ativo').forEach(c => c.classList.remove('ativo'));
  card.classList.add('ativo');
  if (rolar) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function render() {
  const f = Object.fromEntries(CAMPOS.map(id => [id, $(id).value]));
  const vis = dados.filter(e =>
    (!f.cidade || e.cidade === f.cidade) && (!f.tipo || e.tipo === f.tipo) && (!f.etapa || e.etapa === f.etapa) &&
    (!f.construtora || e.construtora === f.construtora) &&
    (!f.dorms || (e.dorms && e.dorms[1] >= +f.dorms)) && (!f.m2 || (e.m2 && e.m2[1] >= +f.m2)) &&
    (!f.estacao || (e.estacao && e.estacao.km <= +f.estacao)));
  const n = CAMPOS.filter(id => f[id]).length;
  $('nFiltros').hidden = !n; $('nFiltros').textContent = n;
  $('total').textContent = `${vis.length} empreendimento${vis.length === 1 ? '' : 's'}`;
  const nNovidades = eventosVisiveis(DIAS_NOVO).length;
  $('nNovidades').hidden = !nNovidades; $('nNovidades').textContent = nNovidades;
  $('abrirNovidades').setAttribute('aria-label', `Novidades: ${nNovidades} na última semana`);
  const novoDesde = diasAtras(DIAS_NOVO);
  camada.clearLayers(); $('lista').innerHTML = ''; abrirPor.clear(); fila = []; mostrados = 0;
  if (!vis.length) $('lista').innerHTML = '<p class="vazio">Nenhum empreendimento com esses filtros.<br>Tente limpar algum deles.</p>';
  const marcadores = [];
  vis.forEach((e, i) => {
    const [cls] = ETAPA[e.etapa] || [''];
    const fatos = [faixa(e.dorms, ' dorm.'), e.tipo === 'Lote' && e.m2 ? `lotes a partir de ${e.m2[0]} m²` : faixa(e.m2, ' m²')].filter(Boolean).join(' · ');
    const novo = e.desde && e.desde >= novoDesde ? `<span class="selo-novo" title="No site desde ${dataBR(e.desde)}">Novo</span>` : '';
    const html = `<span class="etapa ${cls}">${esc(e.etapa)}</span>${novo}<h2>${esc(e.nome)}</h2>
      <p class="info">${esc(e.tipo)} · ${esc(e.construtora)} · ${esc(e.cidade ?? '')}${e.uf ? ' - ' + esc(e.uf) : ''}</p>
      ${e.endereco ? `<p class="info">${esc(e.endereco)}</p>` : ''}
      ${fatos ? `<p class="fatos">${fatos}</p>` : ''}
      ${e.entrega ? `<p class="info">Entrega: ${esc(e.entrega)}</p>` : ''}
      ${arredores(e)}
      <a class="fonte" href="${esc(e.fonte)}" target="_blank" rel="noopener">Ver na fonte original ↗</a>`;
    let card, m, abrir;
    const obterCard = () => {  // criado so quando entra na lista (ou quando o pino dele e clicado)
      if (card) return card;
      card = document.createElement('article');
      card.className = 'card'; card.tabIndex = 0;
      card.innerHTML = (e.imagem ? `<img src="${esc(e.imagem)}" alt="" loading="lazy" decoding="async" width="600" height="300">` : '') + `<div class="corpo">${html}</div>`;
      if (abrir) { card.onclick = abrir; card.onkeydown = ev => { if (ev.key === 'Enter') abrir(ev); }; }
      return card;
    };
    const cardVisivel = () => (mostrarAte(i + 1), obterCard());
    fila.push(obterCard);
    if (e.lat == null) return;
    m = L.marker([e.lat, e.lng], { icon: pino(e), title: e.nome }).bindPopup(html, { maxWidth: 260 });
    marcadores.push(m);
    m.on('click', () => marcar(cardVisivel(), !celular.matches));  // no celular a lista fica escondida atras do mapa
    m.on('popupclose', () => card?.classList.remove('ativo'));
    abrir = (ev, rolar = false) => {
      if (ev.target.closest('a')) return;
      if (celular.matches) verLista(false);
      mapa.setView([e.lat, e.lng], 15, { animate: false });
      const grupo = camada.getVisibleParent(m);  // se ainda estiver agrupado, abre o leque antes do popup
      if (grupo && grupo !== m) { camada.once('spiderfied', () => m.openPopup()); grupo.spiderfy(); } else m.openPopup();
      marcar(cardVisivel(), rolar);
    };
    abrirPor.set(e.fonte, abrir);
  });
  camada.addLayers(marcadores);  // em lote: bem mais rapido que um por um
  mostrarAte(LOTE);
  mapa.invalidateSize();
  if (marcadores.length) mapa.fitBounds(camada.getBounds(), { padding: [30, 30], maxZoom: 15 });
}

// a lista cresce de LOTE em LOTE conforme a rolagem chega perto do fim
const LOTE = 30, fimDaLista = document.createElement('div');
let fila = [], mostrados = 0;
function mostrarAte(n) {
  while (mostrados < Math.min(n, fila.length)) $('lista').append(fila[mostrados++]());
  if (mostrados < fila.length) $('lista').append(fimDaLista); else fimDaLista.remove();
}
new IntersectionObserver(es => { if (es[0].isIntersecting) mostrarAte(mostrados + LOTE); },
  { root: $('lista'), rootMargin: '800px' }).observe(fimDaLista);
</script>
</body>
</html>
